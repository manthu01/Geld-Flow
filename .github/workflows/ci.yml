name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Dummy value — enough for `prisma generate`, which only reads the schema
  # and never connects. Real migrations run against services in a later,
  # test-specific job once integration tests exist.
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
